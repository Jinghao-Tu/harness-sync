# ... model config

model_reasoning_summary = "concise"
model_verbosity = "low"
model_context_window = 408000
personality = "pragmatic"
service_tier = "default"
plan_mode_reasoning_effort = "high"

approvals_reviewer = "auto_review"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
memories = false
multi_agent = false
multi_agent_v2 = false
goals = true
terminal_resize_reflow = true
context_management = true

[agents]
enabled = false

[desktop]
# Keep awake
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
# Follow-up messages
followUpQueueMode = "steer"
# Appearance
sansFontSize = 15
codeFontSize = 13
appearanceTheme = "light"
appearanceLightCodeThemeId = "codex"
appearanceDarkCodeThemeId = "catppuccin"
reduced-motion-preference = "system"
appearanceDiffMarkerStyle = "color"
usePointerCursors = true
# Conversation details
conversationDetailMode = "STEPS_COMMANDS"
show-context-window-usage = true
# Reasoning effort
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
show-ultra-in-model-picker-slider = true
# Git and pull requests
git-commit-instructions = "Use Conventional Commit. Use English."
git-pr-instructions = "Use Conventional Commit. Use English."
git-show-sidebar-pr-icons = false
